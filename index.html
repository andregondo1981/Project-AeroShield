<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Cloud Platform | Production Service</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; max-width: 500px; border: 1px solid #334155; }
        h1 { color: #38bdf8; margin-bottom: 10px; font-size: 24px; }
        p { color: #94a3b8; line-height: 1.5; }
        .badge { display: inline-block; background: #065f46; color: #34d399; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Secure Cloud Service Active</h1>
        <p>This application is continuously deployed via GitHub Actions, scanned for security vulnerabilities at every build stage, and orchestrated on AWS ECS.</p>
        <div class="badge">Pipeline Status: Secure &amp; Operational</div>
    </div>
</body>
</html>
